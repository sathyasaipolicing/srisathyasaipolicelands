<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Sathya Sai District Police — Lands Digitalization</title>
<style>
  :root{
    --navy-deep:#0B2138;
    --navy:#16385C;
    --navy-soft:#274B70;
    --gold:#A9762F;
    --gold-soft:#C79A54;
    --paper:#F6F3EC;
    --card:#FFFFFF;
    --line:#DED7C7;
    --ink:#182430;
    --muted:#5B6672;
    --good:#2F6B4F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:400;
    margin:0;
  }
  a{color:var(--navy);text-decoration:none;}
  a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  header.site-bar{
    background:var(--navy-deep);
    border-bottom:2px solid var(--gold);
  }
  .site-bar-inner{
    max-width:1100px;margin:0 auto;padding:10px 20px;
  }
  .site-bar-inner a{color:#EFEAE0;font-size:13.5px;letter-spacing:.01em;}
  .site-bar-inner a:hover{color:#fff;text-decoration:underline;}

  .page-wrap{max-width:1100px;margin:0 auto;padding:0 20px 64px;}

  .hero-image-wrap{position:relative;width:100%;margin:0;}
  .hero-image-wrap img{width:100%;display:block;}
  .hero-hotspot{
    position:absolute;left:30%;top:57.5%;width:40%;height:23%;
    cursor:pointer;border-radius:10px;transition:box-shadow .15s;
  }
  .hero-hotspot:hover{box-shadow:0 0 0 4px rgba(255,255,255,.55) inset;}
  .hero-hotspot:focus-visible{outline:3px solid var(--gold);outline-offset:3px;}
  .cta-row{text-align:center;max-width:1100px;margin:24px auto 6px;padding:0 20px;}
  .cta-button{
    display:inline-block;padding:14px 32px;
    background:linear-gradient(90deg,#1476c9,#1fae7a);
    color:#fff;font-size:16px;font-weight:600;border-radius:6px;
    box-shadow:0 4px 14px rgba(20,90,150,.25);transition:box-shadow .15s,transform .15s;
  }
  .cta-button:hover{box-shadow:0 6px 20px rgba(20,90,150,.35);transform:translateY(-1px);}

  .lands-image-wrap{position:relative;width:100%;margin:0;}
  .lands-image-wrap img{width:100%;display:block;}
  .lands-hotspot{position:absolute;cursor:pointer;border-radius:8px;transition:box-shadow .15s;}
  .lands-hotspot:hover{box-shadow:0 0 0 4px rgba(255,255,255,.6) inset;}
  .lands-hotspot:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

  nav.crumbs{font-size:14px;color:var(--muted);margin:0 0 18px;}
  nav.crumbs a{color:var(--navy);}
  nav.crumbs a:hover{text-decoration:underline;}
  nav.crumbs .sep{margin:0 6px;color:var(--line);}
  nav.crumbs .current{color:var(--ink);}

  .view{animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){.view{animation:none;}}

  h3.section-title{font-size:15px;color:var(--navy);margin:0 0 12px;font-weight:600;font-family:inherit;}

  .sub-panel{
    background:linear-gradient(160deg,#DCEEFB 0%,#EAF6F0 55%,#F3F7FB 100%);
    border:2px solid var(--gold);border-radius:16px;
    padding:26px 26px 30px;margin-top:20px;
  }
  .detail-head{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:14px;}
  .detail-head h2{font-size:26px;color:var(--navy-deep);}
  .detail-head .sub-label{font-size:13.5px;color:var(--muted);margin-top:4px;}
  .sub-badge{
    background:#fff;border:2px solid var(--gold);border-radius:30px;
    padding:8px 18px;font-size:12.5px;font-weight:700;color:var(--navy-deep);
    text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;
  }
  .gold-divider{width:170px;height:1px;background:var(--gold);margin:16px 0 22px;position:relative;}
  .gold-divider::before{
    content:'\25C6';color:var(--gold);position:absolute;left:64px;top:-6px;
    font-size:10px;background:#EAF6F0;padding:0 4px;
  }

  .station-list{border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--card);}
  .station-row{
    display:flex;align-items:center;gap:14px;padding:13px 16px;
    border-bottom:1px solid var(--line);transition:background .12s;
  }
  .station-row:last-child{border-bottom:none;}
  .station-row:hover{background:#FBF9F3;}
  .station-row .idx{color:var(--muted);font-size:13px;width:22px;flex:none;text-align:right;}
  .station-row .name{flex:1;font-size:15.5px;color:var(--ink);}
  .station-row .count{font-size:12.5px;padding:3px 10px;border-radius:20px;white-space:nowrap;flex:none;}
  .count.has{background:#EAF1EC;color:var(--good);}
  .count.none{background:#F1EEE7;color:var(--muted);}
  .open-pill{
    display:inline-flex;align-items:center;gap:3px;flex:none;
    background:var(--navy);color:#fff;font-size:12px;font-weight:600;
    padding:5px 12px;border-radius:20px;white-space:nowrap;
  }
  .station-row:hover .open-pill{background:var(--gold);}

  .lands-block{margin-top:24px;}
  ol.lands{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:5px;background:var(--card);}
  ol.lands li{
    display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:15px;
    align-items:center;justify-content:space-between;
  }
  ol.lands li:last-child{border-bottom:none;}
  ol.lands li .num{color:var(--gold);font-family:Georgia,serif;flex:none;min-width:18px;}
  ol.lands li .land-name{flex:1;}
  .view-pill{
    display:inline-flex;align-items:center;gap:3px;flex:none;
    background:var(--good);color:#fff;font-size:12px;font-weight:600;
    padding:5px 12px;border-radius:20px;white-space:nowrap;text-decoration:none;
  }
  .view-pill:hover{background:#1F5C3F;}
  .empty-state{
    border:1px dashed var(--line);border-radius:5px;padding:22px 18px;
    color:var(--muted);font-size:14.5px;background:#FBFAF6;
  }
  .print-link{display:inline-block;margin-top:22px;font-size:13px;color:var(--navy-soft);}
  .print-link:hover{text-decoration:underline;}

  @media print{
    header.site-bar,nav.crumbs,.print-link,.cta-row{display:none;}
    body{background:#fff;}
  }

  footer{max-width:1100px;margin:32px auto 0;padding:16px 20px 40px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);}
</style>
</head>

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function findSub(key){ return DATA.subdivisions.find(s => s.key === key); }
function crumbs(items){
  const parts = items.map((it,i)=>{
    if(i === items.length-1) return `<span class="current">${esc(it.label)}</span>`;
    return `<a href="${it.href}">${esc(it.label)}</a>`;
  });
  return `<nav class="crumbs">${parts.join('<span class="sep">/</span>')}</nav>`;
}
function landName(item){ return typeof item === 'string' ? item : item.name; }
function landLink(item){ return typeof item === 'string' ? null : (item.link || null); }
function landsList(lands){
  if(!lands.length){
    return `<div class="empty-state">No land records on file for this station yet.</div>`;
  }
  return `<ol class="lands">` + lands.map((item,i)=>{
    const name = landName(item), link = landLink(item);
    const viewBtn = link ? `<a class="view-pill" href="${esc(link)}" target="_blank" rel="noopener">View &rsaquo;</a>` : '';
    return `<li><span class="num">${i+1}.</span><span class="land-name">${esc(name)}</span>${viewBtn}</li>`;
  }).join('') + `</ol>`;
}

function viewHome(){

  </div>`;
}

function viewLands(){

    { href: '#/sub/dharmavaram',    left: 81.5, width: 14.0 }
  ];
  const top = 42, height = 28;
  const hotspots = spots.map(s=>
    `<a class="lands-hotspot" href="${s.href}" style="left:${s.left}%;top:${top}%;width:${s.width}%;height:${height}%;" aria-label="View"></a>`

    <div class="lands-image-wrap">
      <img src="lands.jpg" alt="Sri Sathya Sai District Police — Lands Digitalization: District Head Quarters, Penukonda, Kadiri, Hindupur, Puttaparthi and Dharmavaram Sub-Divisions">
      ${hotspots}
    </div>
  </div>`;
}

function viewSub(key){
  const sub = findSub(key);
  if(!sub) return viewHome();
  document.title = sub.name + ' Sub-Division — Lands Digitalization';
  const rows = sub.stations.map((st,i)=>{
    const n = st.lands.length;
    const chip = n ? `<span class="count has">${n} ${n===1?'land':'lands'}</span>` : `<span class="count none">No records</span>`;
    return `<a class="station-row" href="#/ps/${sub.key}/${i}">
      <span class="idx">${i+1}.</span>
      <span class="name">${esc(st.name)}</span>
      ${chip}
      <span class="open-pill">Open &rsaquo;</span>
    </a>`;
  }).join('');
  return `<div class="view page-wrap">
    <div class="sub-panel">
      ${crumbs([{label:'Home', href:'#/'}, {label:'Police Lands Information', href:'#/lands'}, {label: sub.name}])}
      <div class="detail-head">
        <div>
          <h2>${esc(sub.name)} Sub-Division</h2>
          <div class="sub-label">${sub.stations.length} police stations</div>
        </div>
        <span class="sub-badge">${esc(sub.name)} Sub-Division</span>
      </div>
      <div class="gold-divider"></div>
      <div class="station-list">${rows}</div>
    </div>
  </div>`;
}

function viewStation(subKey, idx){
  const sub = findSub(subKey);
  if(!sub || !sub.stations[idx]) return viewHome();
  const st = sub.stations[idx];
  document.title = st.name + ' — Lands Digitalization';
  return `<div class="view page-wrap">
    <div class="sub-panel">
      ${crumbs([{label:'Home', href:'#/'}, {label:'Police Lands Information', href:'#/lands'}, {label: sub.name, href:'#/sub/'+sub.key}, {label: st.name}])}
      <div class="detail-head">
        <div>
          <h2>${esc(st.name)}</h2>
          <div class="sub-label">${esc(sub.name)} Sub-Division</div>
        </div>
      </div>
      <div class="gold-divider"></div>
      <div class="lands-block">
        <h3 class="section-title">Land records</h3>
        ${landsList(st.lands)}
      </div>
      <a class="print-link" href="#" onclick="window.print();return false;">Print this page</a>
    </div>
  </div>`;
}

}

function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if(parts[0] === 'lands') return {view:'lands'};
  if(parts[0] === 'sub' && parts[1]) return {view:'sub', key: parts[1]};
  if(parts[0] === 'ps' && parts[1] && parts[2] !== undefined) return {view:'ps', key: parts[1], idx: parseInt(parts[2],10)};
  if(parts[0] === 'hq') return {view:'hq'};
  return {view:'home'};
}
function render(){
  const route = parseHash();
  const app = document.getElementById('app');
  let html;
  if(route.view === 'lands') html = viewLands();
  else if(route.view === 'sub') html = viewSub(route.key);
  else if(route.view === 'ps') html = viewStation(route.key, route.idx);
  else if(route.view === 'hq') html = viewHQ();
  else html = viewHome();
  app.innerHTML = html;
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);
render();
</script>

</body>
</html>
