<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sri Sathya Sai District Police — Lands Digitalization</title>
<meta name="description" content="Sub-division, police station and land-wise records of Sri Sathya Sai District Police.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sri Sathya Sai District Police">
<meta property="og:title" content="Sri Sathya Sai District Police — Lands Digitalization">
<meta property="og:description" content="Sub-division, police station and land-wise land records with photographs and documents.">
<meta property="og:url" content="https://sathyasaipolicing.github.io/srisathyasaipolicelands/">
<meta property="og:image" content="https://sathyasaipolicing.github.io/srisathyasaipolicelands/assets/preview.jpg">
<meta property="og:image:secure_url" content="https://sathyasaipolicing.github.io/srisathyasaipolicelands/assets/preview.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Sri Sathya Sai District Police Lands Digitalization">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Sri Sathya Sai District Police — Lands Digitalization">
<meta name="twitter:description" content="Sub-division, police station and land-wise land records with photographs and documents.">
<meta name="twitter:image" content="https://sathyasaipolicing.github.io/srisathyasaipolicelands/assets/preview.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Hind+Guntur:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#12285E;
    --navy-d:#0A1740;
    --gold:#C9A227;
    --gold-lt:#F0D98A;
    --line:#D9E1EE;
    --text:#1B2438;
    --muted:#5A6579;
    --flag:#9B2C21;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:linear-gradient(180deg,#DCE9F7 0%,#EFF4FA 240px,#F4F7FB 100%);
    min-height:100vh;color:var(--text);
    font-family:'Hind Guntur',system-ui,sans-serif;font-size:16px;line-height:1.5;
  }
  .te{font-family:'Hind Guntur',sans-serif}

  /* ================= MAIN PAGE ================= */
  .hero{position:relative;max-width:1535px;margin:0 auto;line-height:0}
  .hero img{width:100%;height:auto;display:block}
  .hotspot{
    position:absolute;left:25.86%;top:52.44%;width:50.81%;height:24.02%;
    border-radius:14px;display:block;transition:box-shadow .18s ease, transform .18s ease;
  }
  .hotspot:hover{box-shadow:0 0 0 4px var(--gold-lt), 0 12px 28px rgba(11,27,66,.35);transform:translateY(-2px)}
  .hotspot:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
  .mobtab{display:none}

  /* ================= HEADER ================= */
  .topbar{
    background:linear-gradient(115deg,#0A1740 0%,#12285E 45%,#1B3A82 100%);
    padding:16px 20px 14px;position:relative;
  }
  .topbar:after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
    background:linear-gradient(90deg,#8A6D1A 0%,var(--gold) 35%,var(--gold-lt) 50%,var(--gold) 65%,#8A6D1A 100%);
  }
  .topwrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:70px 1fr 70px;align-items:center;gap:16px}
  .topwrap img{width:70px;height:70px;object-fit:contain}
  .dtab{
    justify-self:center;text-align:center;
    background:linear-gradient(180deg,#20489C 0%,#12285E 100%);
    border:2px solid var(--gold);border-radius:6px;padding:11px 46px;
    box-shadow:0 6px 18px rgba(0,0,0,.3), inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .dtab .en{font-family:'Rajdhani',sans-serif;font-weight:700;color:#fff;
    font-size:clamp(22px,3.4vw,34px);letter-spacing:.06em;line-height:1.1}
  .dtab .te{font-size:14.5px;color:var(--gold-lt);margin-top:2px}

  main{max-width:1180px;margin:0 auto;padding:26px 20px 64px}

  .crumb{font-size:14px;color:var(--muted);margin-bottom:20px}
  .crumb a{color:var(--navy);text-decoration:none;border-bottom:1px solid var(--line)}
  .crumb a:hover{border-color:var(--gold)}
  .crumb .sep{margin:0 8px;color:#A5AEBF}

  /* ================= SECTION BANNER ================= */
  .banner{
    position:relative;color:#fff;padding:16px 26px;margin-bottom:26px;border-radius:6px;
    box-shadow:0 8px 22px rgba(18,40,94,.18);overflow:hidden;
  }
  .banner:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--gold)}
  .banner h2{margin:0;font-family:'Rajdhani',sans-serif;font-weight:700;
    font-size:clamp(21px,3vw,28px);letter-spacing:.06em}
  .banner p{margin:3px 0 0;font-size:14px;color:rgba(255,255,255,.82)}

  .orn{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0}
  .orn i{height:1px;width:34px;background:linear-gradient(90deg,transparent,var(--gold))}
  .orn i:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
  .orn b{color:var(--gold);font-size:11px;line-height:1}

  /* ================= DISTRICT HEAD QUARTERS CARD ================= */
  .scard.hq{border:2px solid var(--gold);box-shadow:0 8px 22px rgba(138,109,26,.22)}
  .scard.hq .nm{font-size:20px;line-height:1.2}
  .scard.hq .cap{height:104px}

  /* ================= SUB-DIVISION CARDS ================= */
  .subgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:20px}
  .scard{
    display:flex;flex-direction:column;text-decoration:none;background:#fff;
    border-radius:12px;overflow:hidden;border:1px solid var(--line);
    box-shadow:0 6px 18px rgba(18,40,94,.10);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .scard:hover{transform:translateY(-6px);box-shadow:0 16px 34px rgba(18,40,94,.22)}
  .scard:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .scard .cap{height:104px;display:flex;align-items:center;justify-content:center;border-bottom:3px solid var(--gold);position:relative}
  .scard .cap:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.22),transparent 60%)}
  .scard .ring{
    width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.16);
    border:2px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;
  }
  .scard svg{width:30px;height:30px;fill:#fff}
  .scard .bd{padding:18px 14px 16px;text-align:center;flex:1}
  .scard .nm{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:27px;letter-spacing:.05em}
  .scard .tel{font-family:'Hind Guntur',sans-serif;font-size:15px;color:var(--muted);margin-top:2px}
  .scard .cnt{display:inline-block;font-size:12.5px;font-weight:600;letter-spacing:.07em;color:#fff;padding:6px 15px;border-radius:20px}
  .scard .ft{padding:11px;text-align:center;font-family:'Rajdhani',sans-serif;
    font-size:15px;letter-spacing:.1em;color:#fff}

  /* ================= STATION / LAND CARDS ================= */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(246px,1fr));gap:16px}
  .pcard{
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;
    text-decoration:none;background:#fff;
    border:1px solid var(--line);border-radius:10px;padding:20px 15px 18px;
    box-shadow:0 4px 12px rgba(18,40,94,.08);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .pcard:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(18,40,94,.18)}
  .pcard:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .pcard .num{
    width:38px;height:38px;border-radius:9px;flex:none;color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Rajdhani',sans-serif;font-size:19px;font-weight:700;
  }
  .pcard .num svg{width:19px;height:19px;fill:#fff}
  .pcard .t{width:100%}
  .pcard .t .nm{display:block;font-family:'Rajdhani',sans-serif;font-size:21px;font-weight:700;letter-spacing:.04em;line-height:1.2}
  .pcard .t .sm{display:block;font-size:13px;color:var(--muted);margin-top:3px}
  .pcard .arw{color:var(--gold);font-size:20px;line-height:1}

  .empty{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:30px;color:var(--muted);text-align:center}

  /* ================= LAND DETAIL ================= */
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:24px}
  .fact{padding:15px 18px;border-right:1px solid var(--line)}
  .fact:last-child{border-right:none}
  .fact .k{font-size:12.5px;color:var(--muted)}
  .fact .v{font-size:16.5px;font-weight:600;color:var(--navy);margin-top:3px}
  .flagged{color:var(--flag)}
  .remarks{background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:8px;padding:15px 18px;margin-bottom:24px}
  h3.sec{font-family:'Rajdhani',sans-serif;font-size:21px;letter-spacing:.06em;color:var(--navy);margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px;margin-bottom:28px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 4px 12px rgba(18,40,94,.08)}
  .card .thumb{height:152px;background:#DDE5F0;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
  .card .thumb img{width:100%;height:100%;object-fit:cover}
  .card video{width:100%;height:152px;background:#000}
  .card .kind{font-family:'Rajdhani',sans-serif;font-size:16px;letter-spacing:.1em;color:var(--flag);font-weight:700}
  .card .cp{padding:11px 13px;font-size:14px;flex:1}
  .card .acts{display:flex;border-top:1px solid var(--line)}
  .card .acts a{flex:1;text-align:center;padding:10px 4px;font-size:13px;text-decoration:none;color:var(--navy);border-right:1px solid var(--line)}
  .card .acts a:last-child{border-right:none}
  .card .acts a:hover{background:#F5F1E3;color:#8A6D1A}

  .lb{position:fixed;inset:0;background:rgba(8,16,38,.94);display:none;align-items:center;justify-content:center;z-index:60;padding:24px}
  .lb.on{display:flex}
  .lb img{max-width:94vw;max-height:82vh;object-fit:contain}
  .lb .close{position:absolute;top:14px;right:20px;background:none;border:none;color:#fff;font-size:34px;cursor:pointer}
  .lb .dl{position:absolute;bottom:22px;color:var(--gold-lt);text-decoration:none;border-bottom:1px solid var(--gold-lt)}

  footer{background:linear-gradient(90deg,#0A1740,#12285E,#0A1740);color:#B7C4DE;text-align:center;padding:18px;font-size:13.5px;border-top:4px solid var(--gold)}
  footer b{color:#fff;font-weight:600}

  @media (max-width:700px){
    .mobtab{
      display:block;margin:14px 16px 4px;padding:18px;text-align:center;text-decoration:none;
      background:linear-gradient(135deg,#12285E 0%,#1B7A3E 100%);color:#fff;border:2px solid var(--gold);border-radius:8px;
      font-family:'Rajdhani',sans-serif;font-size:22px;letter-spacing:.08em;font-weight:700;
    }
    .hotspot{display:none}
    .topwrap{grid-template-columns:46px 1fr}
    .topwrap img{width:46px;height:46px}
    .dtab{padding:9px 16px}
    .fact{border-right:none;border-bottom:1px solid var(--line)}
    .scard.hq .nm{font-size:19px}
  }
</style>
</head>
<body>

<div id="shell"></div>

<div class="lb" id="lb">
  <button class="close" id="lbClose" aria-label="Close">&times;</button>
  <img id="lbImg" alt="">
  <a class="dl" id="lbDl" download>Download this photo</a>
</div>

<script>
function startApp(){
  var shell = document.getElementById('shell');

  var ICON = {
    pin:'<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>',
    bldg:'<svg viewBox="0 0 24 24"><path d="M3 21V9l9-6 9 6v12h-7v-6h-4v6H3zm6-9h2v-2H9v2zm4 0h2v-2h-2v2z"/></svg>',
    land:'<svg viewBox="0 0 24 24"><path d="M3 5l6-2 6 2 6-2v16l-6 2-6-2-6 2V5zm6 1.9v10.2l6 2V8.9l-6-2z"/></svg>'
  };

  /* District Head Quarters block from data.js (optional) */
  var HQ = (typeof HEADQUARTERS !== 'undefined' && HEADQUARTERS) ? HEADQUARTERS : null;

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  /* darken / lighten a hex colour */
  function shade(hex, p){
    var n = parseInt(hex.slice(1),16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    r=Math.max(0,Math.min(255,Math.round(r+r*p)));
    g=Math.max(0,Math.min(255,Math.round(g+g*p)));
    b=Math.max(0,Math.min(255,Math.round(b+b*p)));
    return 'rgb('+r+','+g+','+b+')';
  }
  function grad(c){ return 'linear-gradient(135deg,'+shade(c,.30)+' 0%,'+c+' 55%,'+shade(c,-.28)+' 100%)'; }

  function findSub(id){ for (var i=0;i<SUBDIVISIONS.length;i++) if (SUBDIVISIONS[i].id===id) return SUBDIVISIONS[i]; return null; }
  function findPs(s,id){ if(!s) return null; for (var i=0;i<s.stations.length;i++) if (s.stations[i].id===id) return s.stations[i]; return null; }
  function findLand(p,id){ if(!p) return null; var L=p.lands||[]; for (var i=0;i<L.length;i++) if (L[i].id===id) return L[i]; return null; }

  function topbar(){
    return '<div class="topbar"><div class="topwrap">' +
      '<a href="#/"><img src="'+esc(SITE.logo)+'" alt="District Police emblem" onerror="this.style.visibility=\'hidden\'"></a>' +
      '<div class="dtab"><div class="en">'+esc(SITE.district)+'</div>' +
      '<div class="te">'+esc(SITE.districtTe)+'</div></div><span></span>' +
      '</div></div>';
  }
  function foot(){ return '<footer><b>'+esc(SITE.officer.name)+'</b> — '+esc(SITE.officer.designation)+'</footer>'; }
  function ornament(){ return '<div class="orn"><i></i><b>&#10022;</b><i></i></div>'; }
  function crumbs(parts){
    var h='<div class="crumb">';
    parts.forEach(function(p,i){
      if(i) h+='<span class="sep">/</span>';
      h += p.href ? '<a href="'+p.href+'">'+esc(p.label)+'</a>' : esc(p.label);
    });
    return h+'</div>';
  }
  function banner(title, sub, colour){
    return '<div class="banner" style="background:'+grad(colour||'#12285E')+'">' +
           '<h2>'+esc(title)+'</h2>' + (sub ? '<p>'+esc(sub)+'</p>' : '') + '</div>';
  }
  function page(inner){ return topbar() + '<main>' + inner + '</main>' + foot(); }

  /* ---------- 1. MAIN PAGE ---------- */
  function home(){
    return '<div class="hero">' +
      '<img src="'+esc(SITE.mainImage)+'" alt="Sri Sathya Sai District Police Lands Digitalization">' +
      '<a class="hotspot" href="#/subdivisions" aria-label="Police Lands Information"></a></div>' +
      '<a class="mobtab" href="#/subdivisions">POLICE LANDS INFORMATION</a>' + foot();
  }

  /* ---------- 2. SUB-DIVISIONS ---------- */
  function subdivisions(){
    var h = crumbs([{label:'Main page',href:'#/'},{label:'Police lands'}]);
    h += banner('POLICE LANDS INFORMATION','District head quarters and sub-division wise land records');
    h += '<div class="subgrid">';
    if (HQ){
      h += '<a class="scard hq" href="#/hq">' +
           '<div class="cap" style="background:'+grad(HQ.color)+'"><span class="ring">'+ICON.bldg+'</span></div>' +
           '<div class="bd">' +
             '<div class="nm" style="color:'+esc(HQ.color)+'">DISTRICT HEAD QUARTERS</div>' +
             '<div class="tel">'+esc(HQ.nameTe||'')+'</div>' + ornament() +
             '<span class="cnt" style="background:'+esc(HQ.color)+'">LANDS &ndash; '+((HQ.lands||[]).length)+'</span>' +
           '</div>' +
           '<div class="ft" style="background:'+shade(HQ.color,-.30)+'">VIEW LANDS</div></a>';
    }
    SUBDIVISIONS.forEach(function(s){
      h += '<a class="scard" href="#/sub/'+s.id+'">' +
           '<div class="cap" style="background:'+grad(s.color)+'"><span class="ring">'+ICON.pin+'</span></div>' +
           '<div class="bd">' +
             '<div class="nm" style="color:'+esc(s.color)+'">'+esc(s.name).toUpperCase()+'</div>' +
             '<div class="tel">'+esc(s.nameTe)+'</div>' + ornament() +
             '<span class="cnt" style="background:'+esc(s.color)+'">POLICE STATIONS &ndash; '+s.stations.length+'</span>' +
           '</div>' +
           '<div class="ft" style="background:'+shade(s.color,-.30)+'">VIEW STATIONS</div></a>';
    });
    return page(h + '</div>');
  }

  /* ---------- 3. POLICE STATIONS ---------- */
  function stations(subId){
    var s = findSub(subId);
    if(!s) return page(notFound());
    var h = crumbs([{label:'Main page',href:'#/'},{label:'Police lands',href:'#/subdivisions'},{label:s.name}]);
    h += banner(s.name.toUpperCase()+' SUB-DIVISION','Police stations – '+s.stations.length, s.color);
    if(!s.stations.length) return page(h + '<div class="empty">No police stations added yet.</div>');
    h += '<div class="pgrid">';
    s.stations.forEach(function(p,i){
      h += '<a class="pcard" href="#/ps/'+s.id+'/'+p.id+'" style="border-top:4px solid '+esc(s.color)+'">' +
           '<span class="num" style="background:'+grad(s.color)+'">'+(i+1)+'</span>' +
           '<span class="t"><span class="nm" style="color:'+esc(s.color)+'">'+esc(p.name)+'</span>' +
           '<span class="sm">'+((p.lands||[]).length)+' lands</span></span>' +
           '<span class="arw">&rsaquo;</span></a>';
    });
    return page(h + '</div>');
  }

  /* ---------- 4. LANDS ---------- */
  function lands(subId, psId){
    var s = findSub(subId), p = findPs(s, psId);
    if(!p) return page(notFound());
    var h = crumbs([{label:'Main page',href:'#/'},{label:'Police lands',href:'#/subdivisions'},
                    {label:s.name,href:'#/sub/'+s.id},{label:p.name}]);
    h += banner(p.name.toUpperCase(), s.name+' sub-division', s.color);
    if(!(p.lands||[]).length) return page(h + '<div class="empty">No lands added yet.</div>');
    h += '<div class="pgrid">';
    p.lands.forEach(function(l){
      var meta = [l.survey,l.extent].filter(Boolean).join('  \u00b7  ') || ((l.files||[]).length + ' files');
      h += '<a class="pcard" href="#/land/'+s.id+'/'+p.id+'/'+l.id+'" style="border-top:4px solid '+esc(s.color)+'">' +
           '<span class="num" style="background:'+grad(s.color)+'">'+ICON.land+'</span>' +
           '<span class="t"><span class="nm" style="color:'+esc(s.color)+'">'+esc(l.name).toUpperCase()+'</span>' +
           '<span class="sm">'+esc(meta)+'</span></span>' +
           '<span class="arw">&rsaquo;</span></a>';
    });
    return page(h + '</div>');
  }

  /* ---------- 5. DISTRICT HEAD QUARTERS ---------- */
  function hqLands(){
    if(!HQ) return page(notFound());
    var h = crumbs([{label:'Main page',href:'#/'},{label:'Police lands',href:'#/subdivisions'},{label:HQ.name}]);
    h += banner(HQ.name.toUpperCase(), 'Lands \u2013 '+((HQ.lands||[]).length), HQ.color);
    var L = HQ.lands || [];
    if(!L.length) return page(h + '<div class="empty">No lands added yet.</div>');
    h += '<div class="pgrid">';
    L.forEach(function(l){
      var meta = [l.survey,l.extent].filter(Boolean).join('  \u00b7  ') || ((l.files||[]).length + ' files');
      h += '<a class="pcard" href="#/hqland/'+l.id+'" style="border-top:4px solid '+esc(HQ.color)+'">' +
           '<span class="num" style="background:'+grad(HQ.color)+'">'+ICON.land+'</span>' +
           '<span class="t"><span class="nm" style="color:'+esc(HQ.color)+'">'+esc(l.name).toUpperCase()+'</span>' +
           '<span class="sm">'+esc(meta)+'</span></span>' +
           '<span class="arw">&rsaquo;</span></a>';
    });
    return page(h + '</div>');
  }

  function hqLand(landId){
    if(!HQ) return page(notFound());
    var l = findLand(HQ, landId);
    if(!l) return page(notFound());
    return landPage(l,
      [{label:'Main page',href:'#/'},{label:'Police lands',href:'#/subdivisions'},
       {label:HQ.name,href:'#/hq'},{label:l.name}],
      HQ.name, HQ.color);
  }

  /* ---------- 6. LAND DETAIL ---------- */
  function land(subId, psId, landId){
    var s = findSub(subId), p = findPs(s, psId), l = findLand(p, landId);
    if(!l) return page(notFound());
    return landPage(l,
      [{label:'Main page',href:'#/'},{label:'Police lands',href:'#/subdivisions'},
       {label:s.name,href:'#/sub/'+s.id},{label:p.name,href:'#/ps/'+s.id+'/'+p.id},{label:l.name}],
      p.name+', '+s.name+' sub-division', s.color);
  }

  function landPage(l, crumbParts, subtitle, colour){
    var h = crumbs(crumbParts);
    h += banner(l.name.toUpperCase(), subtitle, colour);

    var facts = [['Survey number',l.survey],['Extent',l.extent],['Village / Mandal',l.village],['Present status',l.status]]
                .filter(function(f){ return f[1]; });
    if (facts.length){
      h += '<div class="facts">';
      facts.forEach(function(f){
        var flag = /dispute|encroach/i.test(f[1]) ? ' flagged' : '';
        h += '<div class="fact"><div class="k">'+esc(f[0])+'</div><div class="v'+flag+'">'+esc(f[1])+'</div></div>';
      });
      h += '</div>';
    }
    if (l.remarks) h += '<div class="remarks">'+esc(l.remarks)+'</div>';

    var files = l.files || [];
    if(!files.length) return page(h + '<div class="empty">Photos, videos and documents for this land have not been uploaded yet.</div>');

    function block(title, list, render){
      if(!list.length) return '';
      var o = '<h3 class="sec">'+title+'</h3><div class="grid">';
      list.forEach(function(f){
        o += '<div class="card">' + render(f) + '<div class="cp">'+esc(f.title)+'</div>' +
             '<div class="acts"><a href="'+esc(f.src)+'" target="_blank" rel="noopener">Open</a>' +
             '<a href="'+esc(f.src)+'" download>Download</a></div></div>';
      });
      return o + '</div>';
    }
    var by = function(t){ return files.filter(function(f){ return f.type===t; }); };

    h += block('PHOTOGRAPHS', by('photo'), function(f){
      return '<div class="thumb" data-full="'+esc(f.src)+'"><img src="'+esc(f.src)+'" alt="'+esc(f.title)+'" ' +
             'onerror="this.parentNode.innerHTML=\'<span class=&quot;kind&quot;>FILE MISSING</span>\'"></div>';
    });
    h += block('VIDEOS', by('video'), function(f){
      return /^https?:/i.test(f.src)
        ? '<div class="thumb"><span class="kind">VIDEO LINK</span></div>'
        : '<video controls preload="metadata" src="'+esc(f.src)+'"></video>';
    });
    h += block('DOCUMENTS', by('pdf'), function(){
      return '<div class="thumb"><span class="kind">PDF</span></div>';
    });
    return page(h);
  }

  function notFound(){
    return '<div class="empty">This page was not found. <a href="#/">Go to the main page</a>.</div>';
  }

  /* ---------- lightbox ---------- */
  var lbEl=document.getElementById('lb'), lbImg=document.getElementById('lbImg'), lbDl=document.getElementById('lbDl');
  function shut(){ lbEl.classList.remove('on'); lbImg.src=''; }
  document.getElementById('lbClose').onclick = shut;
  lbEl.addEventListener('click', function(e){ if(e.target===lbEl) shut(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') shut(); });
  shell.addEventListener('click', function(e){
    var t = e.target.closest ? e.target.closest('.thumb[data-full]') : null;
    if(t){ lbImg.src=t.getAttribute('data-full'); lbDl.href=t.getAttribute('data-full'); lbEl.classList.add('on'); }
  });

  /* ---------- router ---------- */
  function render(){
    var parts = location.hash.replace(/^#\/?/,'').split('/').filter(Boolean), html;
    if(!parts.length) html = home();
    else if(parts[0]==='subdivisions') html = subdivisions();
    else if(parts[0]==='hq') html = hqLands();
    else if(parts[0]==='hqland') html = hqLand(parts[1]);
    else if(parts[0]==='sub') html = stations(parts[1]);
    else if(parts[0]==='ps') html = lands(parts[1], parts[2]);
    else if(parts[0]==='land') html = land(parts[1], parts[2], parts[3]);
    else html = page(notFound());
    shell.innerHTML = html;
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange', render);
  render();
}

/* data.js ni ప్రతిసారి fresh ga load chestundi — browser cache problem raadu */
(function(){
  var sc = document.createElement('script');
  sc.src = 'data.js?t=' + Date.now();
  sc.onload = startApp;
  sc.onerror = function(){
    document.getElementById('shell').innerHTML =
      '<div class="empty" style="margin:40px">data.js file load kaaledu. File repo lo undo ledo check cheyyandi.</div>';
  };
  document.head.appendChild(sc);
})();
</script>
