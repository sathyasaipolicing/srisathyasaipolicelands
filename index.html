<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Sathya Sai District Police — Lands Digitalization</title>
<style>
  :root{
    --navy-deep:#0B2138;
    --navy:#16385C;
    --navy-soft:#274B70;
    --gold:#A9762F;
    --gold-soft:#C79A54;
    --paper:#F6F3EC;
    --card:#FFFFFF;
    --line:#DED7C7;
    --ink:#182430;
    --muted:#5B6672;
    --good:#2F6B4F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:400;
    margin:0;
  }
  a{color:var(--navy);text-decoration:none;}
  a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  /* slim persistent top bar */
  header.site-bar{
    background:var(--navy-deep);
    border-bottom:2px solid var(--gold);
  }
  .site-bar-inner{
    max-width:1100px;margin:0 auto;padding:10px 20px;
  }
  .site-bar-inner a{color:#EFEAE0;font-size:13.5px;letter-spacing:.01em;}
  .site-bar-inner a:hover{color:#fff;text-decoration:underline;}

  .page-wrap{max-width:1100px;margin:0 auto;padding:0 20px 64px;}

  /* HOME / hero banner — full width, edge to edge */
  .hero-image-wrap{position:relative;width:100%;margin:0;}
  .hero-image-wrap img{width:100%;display:block;}
  .hero-hotspot{
    position:absolute;left:30%;top:57.5%;width:40%;height:23%;
    cursor:pointer;border-radius:10px;transition:box-shadow .15s;
  }
  .hero-hotspot:hover{box-shadow:0 0 0 4px rgba(255,255,255,.55) inset;}
  .hero-hotspot:focus-visible{outline:3px solid var(--gold);outline-offset:3px;}
  .cta-row{text-align:center;max-width:1100px;margin:24px auto 6px;padding:0 20px;}
  .cta-button{
    display:inline-block;padding:14px 32px;
    background:linear-gradient(90deg,#1476c9,#1fae7a);
    color:#fff;font-size:16px;font-weight:600;border-radius:6px;
    box-shadow:0 4px 14px rgba(20,90,150,.25);transition:box-shadow .15s,transform .15s;
  }
  .cta-button:hover{box-shadow:0 6px 20px rgba(20,90,150,.35);transform:translateY(-1px);}

  nav.crumbs{font-size:14px;color:var(--muted);margin:22px 0 22px;padding-bottom:12px;border-bottom:1px solid var(--line);}
  nav.crumbs a{color:var(--navy);}
  nav.crumbs a:hover{text-decoration:underline;}
  nav.crumbs .sep{margin:0 6px;color:var(--line);}
  nav.crumbs .current{color:var(--ink);}

  .view{animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){.view{animation:none;}}

  /* LANDS LISTING (subdivisions + HQ) */
  .hero h2{font-size:26px;color:var(--navy-deep);margin-bottom:8px;}
  .hero p{color:var(--muted);max-width:62ch;margin:0 0 22px;}
  .totals{display:flex;gap:28px;margin:0 0 30px;flex-wrap:wrap;}
  .totals .stat b{display:block;font-family:Georgia,serif;font-size:30px;color:var(--gold);line-height:1;}
  .totals .stat span{font-size:13px;color:var(--muted);}

  h3.section-title{font-size:15px;color:var(--navy);margin:0 0 12px;font-weight:600;font-family:inherit;}

  /* LANDS PAGE — colorful photo-style cards */
  .lands-header{text-align:center;margin-top:26px;}
  .lands-header h2{color:var(--navy-deep);font-size:24px;letter-spacing:.01em;}
  .gold-divider{width:120px;height:2px;background:var(--gold);margin:16px auto 30px;position:relative;}
  .gold-divider::before{
    content:'\25C6';color:var(--gold);position:absolute;left:50%;top:-7px;
    transform:translateX(-50%);font-size:11px;
    background:var(--paper);padding:0 6px;
  }
  .tab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
  .tab-card{
    position:relative;border-radius:12px;overflow:hidden;min-height:210px;
    display:flex;flex-direction:column;justify-content:flex-end;
    box-shadow:0 4px 14px rgba(11,33,56,.12);
    transition:transform .15s,box-shadow .15s;
  }
  .tab-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(11,33,56,.22);}
  .tab-card-bar{
    position:relative;display:flex;align-items:center;gap:10px;padding:12px 12px;color:#fff;
  }
  .tab-card-icon{
    width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .tab-card-icon svg{width:15px;height:15px;}
  .tab-card-text{flex:1;text-align:left;line-height:1.25;}
  .tab-card-text b{display:block;font-size:12.5px;letter-spacing:.02em;text-transform:uppercase;}
  .tab-card-text span{display:block;font-size:10px;opacity:.85;margin-top:2px;}
  .tab-card-arrow{
    width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.28);flex:none;
    display:flex;align-items:center;justify-content:center;font-size:13px;
  }
  .tab-hq{background:linear-gradient(160deg,#D9BE8C 0%,#8B6F3F 75%);}
  .tab-hq .tab-card-bar{background:#8B6F3F;}
  .tab-penukonda{background:linear-gradient(160deg,#FDBA74 0%,#EA580C 75%);}
  .tab-penukonda .tab-card-bar{background:#EA580C;}
  .tab-kadiri{background:linear-gradient(160deg,#6EE7B7 0%,#16A34A 75%);}
  .tab-kadiri .tab-card-bar{background:#16A34A;}
  .tab-hindupur{background:linear-gradient(160deg,#7DD3FC 0%,#1476C9 75%);}
  .tab-hindupur .tab-card-bar{background:#1476C9;}
  .tab-puttaparthi{background:linear-gradient(160deg,#F9A8D4 0%,#DB2777 75%);}
  .tab-puttaparthi .tab-card-bar{background:#DB2777;}
  .tab-dharmavaram{background:linear-gradient(160deg,#C4B5FD 0%,#7C3AED 75%);}
  .tab-dharmavaram .tab-card-bar{background:#7C3AED;}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:5px;
    padding:16px 18px;display:block;transition:box-shadow .15s,border-color .15s;
  }
  .card:hover{box-shadow:0 4px 14px rgba(11,33,56,.09);border-color:var(--navy-soft);}
  .card .card-name{font-size:17px;color:var(--ink);margin-bottom:12px;font-weight:600;font-family:-apple-system,sans-serif;}
  .card .card-stats{display:flex;gap:22px;}
  .card .card-stats div b{display:block;font-family:Georgia,serif;font-size:22px;color:var(--navy);line-height:1;}
  .card .card-stats div span{font-size:12px;color:var(--muted);}
  .card.hq{border-left:3px solid var(--gold);}

  /* SUBDIVISION LIST */
  .station-list{border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--card);}
  .station-row{
    display:flex;align-items:center;gap:14px;padding:13px 16px;
    border-bottom:1px solid var(--line);transition:background .12s;
  }
  .station-row:last-child{border-bottom:none;}
  .station-row:hover{background:#FBF9F3;}
  .station-row .idx{color:var(--muted);font-size:13px;width:22px;flex:none;text-align:right;}
  .station-row .name{flex:1;font-size:15.5px;color:var(--ink);}
  .station-row .count{font-size:12.5px;padding:3px 10px;border-radius:20px;white-space:nowrap;flex:none;}
  .count.has{background:#EAF1EC;color:var(--good);}
  .count.none{background:#F1EEE7;color:var(--muted);}
  .station-row .chevron{color:var(--line);flex:none;}
  .station-row:hover .chevron{color:var(--gold);}

  /* DETAIL VIEW */
  .detail-head h2{font-size:24px;color:var(--navy-deep);}
  .detail-head .sub-label{font-size:13.5px;color:var(--muted);margin-top:4px;}
  .lands-block{margin-top:24px;}
  ol.lands{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:5px;background:var(--card);}
  ol.lands li{
    display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:15px;
    align-items:baseline;
  }
  ol.lands li:last-child{border-bottom:none;}
  ol.lands li .num{color:var(--gold);font-family:Georgia,serif;flex:none;min-width:18px;}
  ol.lands li a{text-decoration:underline;}
  ol.lands li .ext{font-size:12px;color:var(--muted);margin-left:4px;}
  .empty-state{
    border:1px dashed var(--line);border-radius:5px;padding:22px 18px;
    color:var(--muted);font-size:14.5px;background:#FBFAF6;
  }
  .print-link{display:inline-block;margin-top:22px;font-size:13px;color:var(--navy-soft);}
  .print-link:hover{text-decoration:underline;}

  @media print{
    header.site-bar,nav.crumbs,.print-link,.cta-row{display:none;}
    body{background:#fff;}
  }

  footer{max-width:1100px;margin:32px auto 0;padding:16px 20px 40px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);}
</style>
</head>
<body>

<header class="site-bar">
  <div class="site-bar-inner">
    <a href="#/">Sri Sathya Sai District Police &mdash; Lands Digitalization</a>
  </div>
</header>

<div id="app"></div>

<footer>Sri Sathya Sai District Police &middot; Police Lands Records</footer>

<script>
/* =========================================================
   DATA — edit this section to add/update stations or lands.
   Each subdivision has a key (used in the URL), a display
   name, and a list of stations. Each station has a name and
   a list of land entries.

   A land entry can be written two ways:
     'Some Land Name'                              — plain text
     { name: 'Some Land Name', link: 'https://…' }  — with a link
   Use the second form once you have a Google Drive / Maps
   link for a record; leave others as plain text until then.
   ========================================================= */
const DATA = {
  subdivisions: [
    { key: 'puttaparthi', name: 'Puttaparthi', stations: [
      { name: 'Amadaguru', lands: ['Amadaguru PS Land'] },
      { name: 'Bukkapatnam', lands: ['Bukkapatnam PS Land', 'Bukkapatnam Old Quarters Land'] },
      { name: 'Kotacheruvu', lands: ['Kotacheruvu PS Land'] },
      { name: 'Nallamada', lands: ['Nallamada Old PS Circle Office', 'Nallamada 43 Cents Land'] },
      { name: 'O.D.Cheruvu', lands: ['O.D.Cheruvu PS Land'] },
      { name: 'Puttaparthi Town', lands: ['Puttaparthi Town PS Land'] },
      { name: 'Puttaparthi Rural', lands: [] },
      { name: 'Puttaparthi Security wing', lands: [] },
      { name: 'Puttaparthi Airport', lands: [] }
    ]},
    { key: 'hindupur', name: 'Hindupur', stations: [
      { name: 'Chilmathur', lands: ['Chilmathur PS Land'] },
      { name: 'Hindupur I Town', lands: ['Hindupur I Town PS Land'] },
      { name: 'Hindupur II Town', lands: ['Land 1'] },
      { name: 'Hindupur Rural', lands: ['Hindupur Rural SP Quarters Land'] },
      { name: 'Lepakshi', lands: ['Lepakshi PS Land'] },
      { name: 'Hindupur Traffic', lands: ['Hindupur Traffic PS Land'] }
    ]},
    { key: 'dharmavaram', name: 'Dharmavaram', stations: [
      { name: 'Bathalapalli', lands: ['Battalapalli PS Land'] },
      { name: 'Chennekothapalli', lands: ['CK Palli PS Land'] },
      { name: 'Dharmavaram I Town', lands: ['Dharmavaram I Town PS Land'] },
      { name: 'Dharmavaram II Town', lands: ['Land 1'] },
      { name: 'Dharmavaram Rural', lands: ['Dharmavaram Rural PS Land'] },
      { name: 'Kanaganapalli', lands: ['Kanaganapalli PS Land'] },
      { name: 'Mudigubba', lands: ['Mudigubba PS Land'] },
      { name: 'Patnam', lands: ['Patnam PS Land'] },
      { name: 'Ramagiri', lands: ['Land 1'] },
      { name: 'Tadimarri', lands: ['Tadimarri PS Land'] }
    ]},
    { key: 'penukonda', name: 'Penukonda', stations: [
      { name: 'Agali PS', lands: ['Agali PS Land'] },
      { name: 'Amarapuram PS', lands: ['Amarapuram PS Land'] },
      { name: 'Gudibanda PS', lands: ['Gudibanda PS Land'] },
      { name: 'KIA PS', lands: [] },
      { name: 'Madakasira UPS', lands: ['Madakasira UPS Land'] },
      { name: 'Parigi PS', lands: ['Parigi PS Land'] },
      { name: 'Penukonda PS', lands: ['Penukonda PS Land'] },
      { name: 'Roddam PS', lands: ['Roddam PS Land'] },
      { name: 'Rolla PS', lands: ['Rolla PS Land'] },
      { name: 'Somandapalli PS', lands: ['Somandapalli PS Land'] }
    ]},
    { key: 'kadiri', name: 'Kadiri', stations: [
      { name: 'Gandlapenta', lands: ['Gandlapenta PS Land'] },
      { name: 'Kadiri Rural', lands: ['Kadiri Rural PS Land'] },
      { name: 'Kadiri Town', lands: ['Kadiri Town PS Land'] },
      { name: 'N.P.Kunta', lands: ['N.P.Kunta PS Land'] },
      { name: 'Nallacheruvu', lands: ['Nallacheruvu PS Land'] },
      { name: 'Talupula', lands: ['Talupula PS Land'] },
      { name: 'Tanakallu', lands: ['Tanakallu PS Land'] }
    ]}
  ],
  districtHQ: { name: 'District Head Quarters', lands: ['Parade Ground Land', 'Firing Range Land'] }
};

/* ================= helpers ================= */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function findSub(key){ return DATA.subdivisions.find(s => s.key === key); }
function totalStations(){ return DATA.subdivisions.reduce((a,s)=>a+s.stations.length,0); }
function totalLands(){
  const subTotal = DATA.subdivisions.reduce((a,s)=>a+s.stations.reduce((b,st)=>b+st.lands.length,0),0);
  return subTotal + DATA.districtHQ.lands.length;
}
function crumbs(items){
  const parts = items.map((it,i)=>{
    if(i === items.length-1) return `<span class="current">${esc(it.label)}</span>`;
    return `<a href="${it.href}">${esc(it.label)}</a>`;
  });
  return `<nav class="crumbs">${parts.join('<span class="sep">/</span>')}</nav>`;
}
function landName(item){ return typeof item === 'string' ? item : item.name; }
function landLink(item){ return typeof item === 'string' ? null : (item.link || null); }
function landsList(lands){
  if(!lands.length){
    return `<div class="empty-state">No land records on file for this station yet.</div>`;
  }
  return `<ol class="lands">` + lands.map((item,i)=>{
    const name = landName(item), link = landLink(item);
    const body = link
      ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(name)}</a><span class="ext">opens link ↗</span>`
      : `<span>${esc(name)}</span>`;
    return `<li><span class="num">${i+1}.</span>${body}</li>`;
  }).join('') + `</ol>`;
}

/* ================= views ================= */
function viewHome(){
  document.title = 'Sri Sathya Sai District Police — Lands Digitalization';
  return `<div class="view">
    <div class="hero-image-wrap">
      <img src="hero.png" alt="Sri Sathya Sai District Police — Lands Digitalization">
      <a class="hero-hotspot" href="#/lands" aria-label="View Police Lands Information"></a>
    </div>
    <div class="cta-row"><a class="cta-button" href="#/lands">View Police Lands Information &rarr;</a></div>
  </div>`;
}

const PIN_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 21s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12Z" fill="currentColor"/><circle cx="12" cy="9" r="2.6" fill="#fff"/></svg>';

function viewLands(){
  document.title = 'Police Lands Information — Lands Digitalization';
  const tabOrder = [
    { kind: 'hq', cls: 'tab-hq' },
    { kind: 'sub', key: 'penukonda', cls: 'tab-penukonda' },
    { kind: 'sub', key: 'kadiri', cls: 'tab-kadiri' },
    { kind: 'sub', key: 'hindupur', cls: 'tab-hindupur' },
    { kind: 'sub', key: 'puttaparthi', cls: 'tab-puttaparthi' },
    { kind: 'sub', key: 'dharmavaram', cls: 'tab-dharmavaram' }
  ];
  const cards = tabOrder.map(o=>{
    const isHQ = o.kind === 'hq';
    const href = isHQ ? '#/hq' : '#/sub/' + o.key;
    const title = isHQ ? DATA.districtHQ.name : esc(findSub(o.key).name);
    const subtitle = isHQ ? 'Sri Sathya Sai District' : 'Sub-Division';
    return `<a class="tab-card ${o.cls}" href="${href}">
      <div class="tab-card-bar">
        <span class="tab-card-icon">${PIN_SVG}</span>
        <span class="tab-card-text"><b>${title}</b><span>${subtitle}</span></span>
        <span class="tab-card-arrow">&rsaquo;</span>
      </div>
    </a>`;
  }).join('');
  return `<div class="view">
    <div class="lands-header">
      <h2>Sri Sathya Sai District Police &mdash; Lands Digitalization</h2>
      <div class="gold-divider"></div>
    </div>
    <div class="tab-grid">${cards}</div>
  </div>`;
}

function viewSub(key){
  const sub = findSub(key);
  if(!sub) return viewHome();
  document.title = sub.name + ' Sub-Division — Lands Digitalization';
  const rows = sub.stations.map((st,i)=>{
    const n = st.lands.length;
    const chip = n ? `<span class="count has">${n} ${n===1?'parcel':'parcels'}</span>` : `<span class="count none">No records</span>`;
    return `<a class="station-row" href="#/ps/${sub.key}/${i}">
      <span class="idx">${i+1}.</span>
      <span class="name">${esc(st.name)}</span>
      ${chip}
      <span class="chevron">&rsaquo;</span>
    </a>`;
  }).join('');
  return `<div class="view">
    ${crumbs([{label:'Home', href:'#/'}, {label:'Police Lands Information', href:'#/lands'}, {label: sub.name}])}
    <div class="detail-head">
      <h2>${esc(sub.name)} Sub-Division</h2>
      <div class="sub-label">${sub.stations.length} police stations</div>
    </div>
    <div class="lands-block"><div class="station-list">${rows}</div></div>
  </div>`;
}

function viewStation(subKey, idx){
  const sub = findSub(subKey);
  if(!sub || !sub.stations[idx]) return viewHome();
  const st = sub.stations[idx];
  document.title = st.name + ' — Lands Digitalization';
  return `<div class="view">
    ${crumbs([{label:'Home', href:'#/'}, {label:'Police Lands Information', href:'#/lands'}, {label: sub.name, href:'#/sub/'+sub.key}, {label: st.name}])}
    <div class="detail-head">
      <h2>${esc(st.name)}</h2>
      <div class="sub-label">${esc(sub.name)} Sub-Division</div>
    </div>
    <div class="lands-block">
      <h3 class="section-title">Land records</h3>
      ${landsList(st.lands)}
    </div>
    <a class="print-link" href="#" onclick="window.print();return false;">Print this page</a>
  </div>`;
}

function viewHQ(){
  const hq = DATA.districtHQ;
  document.title = 'District Head Quarters — Lands Digitalization';
  return `<div class="view">
    ${crumbs([{label:'Home', href:'#/'}, {label:'Police Lands Information', href:'#/lands'}, {label: hq.name}])}
    <div class="detail-head">
      <h2>${esc(hq.name)}</h2>
      <div class="sub-label">District-level establishment</div>
    </div>
    <div class="lands-block">
      <h3 class="section-title">Land records</h3>
      ${landsList(hq.lands)}
    </div>
    <a class="print-link" href="#" onclick="window.print();return false;">Print this page</a>
  </div>`;
}

/* ================= router ================= */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if(parts[0] === 'lands') return {view:'lands'};
  if(parts[0] === 'sub' && parts[1]) return {view:'sub', key: parts[1]};
  if(parts[0] === 'ps' && parts[1] && parts[2] !== undefined) return {view:'ps', key: parts[1], idx: parseInt(parts[2],10)};
  if(parts[0] === 'hq') return {view:'hq'};
  return {view:'home'};
}
function render(){
  const route = parseHash();
  const app = document.getElementById('app');
  let html, isHome = false;
  if(route.view === 'lands') html = viewLands();
  else if(route.view === 'sub') html = viewSub(route.key);
  else if(route.view === 'ps') html = viewStation(route.key, route.idx);
  else if(route.view === 'hq') html = viewHQ();
  else { html = viewHome(); isHome = true; }
  app.innerHTML = isHome ? html : `<div class="page-wrap">${html}</div>`;
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);
render();
</script>

</body>
</html>
