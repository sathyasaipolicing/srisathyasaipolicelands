<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sri Sathya Sai District Police — Lands Digitalization</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=Noto+Serif+Telugu:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#12285E;
    --navy-d:#0B1B42;
    --gold:#C9A227;
    --gold-lt:#F0D98A;
    --paper:#EEF1F6;
    --line:#CDD5E2;
    --text:#1B2438;
    --muted:#5A6579;
    --flag:#9B2C21;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--text);
    font-family:'Barlow','Noto Serif Telugu',system-ui,sans-serif;font-size:16px;line-height:1.5;
  }
  .te{font-family:'Noto Serif Telugu',serif}

  /* ================= MAIN PAGE ================= */
  .hero{position:relative;max-width:1535px;margin:0 auto;line-height:0}
  .hero img{width:100%;height:auto;display:block}
  .hotspot{
    position:absolute;
    left:25.86%;top:52.44%;width:50.81%;height:24.02%;
    border-radius:14px;display:block;
    transition:box-shadow .18s ease, transform .18s ease;
  }
  .hotspot:hover{box-shadow:0 0 0 4px var(--gold-lt), 0 12px 28px rgba(11,27,66,.35);transform:translateY(-2px)}
  .hotspot:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
  .mobtab{display:none}

  /* ================= INNER HEADER ================= */
  .topbar{background:var(--navy);border-bottom:4px solid var(--gold);padding:14px 20px}
  .topwrap{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:16px}
  .topwrap img{width:64px;height:64px;object-fit:contain}
  .dtab{
    justify-self:center;text-align:center;
    background:linear-gradient(180deg,#1B3A82 0%,#12285E 100%);
    border:2px solid var(--gold);border-radius:4px;
    padding:11px 40px;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .dtab .en{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;color:#fff;
    font-size:clamp(20px,3.2vw,30px);letter-spacing:.06em;line-height:1.1;
  }
  .dtab .te{font-size:14px;color:var(--gold-lt);margin-top:3px}

  main{max-width:1160px;margin:0 auto;padding:24px 20px 60px}

  .crumb{font-size:14px;color:var(--muted);margin-bottom:20px}
  .crumb a{color:var(--navy);text-decoration:none;border-bottom:1px solid var(--line)}
  .crumb a:hover{border-color:var(--gold)}
  .crumb .sep{margin:0 8px;color:#A5AEBF}

  .banner{
    background:var(--navy);color:#fff;border-left:8px solid var(--gold);
    padding:12px 20px;margin-bottom:22px;
  }
  .banner h2{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;
    font-size:24px;letter-spacing:.05em}
  .banner p{margin:2px 0 0;font-size:13.5px;color:#D6DEF0}

  /* ================= TABS ================= */
  .tabs{display:grid;gap:14px}
  .tabs.five{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .tabs.ps{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .tabs.land{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}

  .tab{
    display:block;text-decoration:none;background:#fff;color:var(--text);
    border:1px solid var(--line);border-top:5px solid var(--navy);
    padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease;
  }
  .tab:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(18,40,94,.16)}
  .tab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .tab .nm{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:21px;letter-spacing:.04em;color:var(--navy)}
  .tab .nm .te{font-family:'Noto Serif Telugu',serif;font-size:15px;letter-spacing:0;display:block;font-weight:600}
  .tab .cnt{
    display:inline-block;margin-top:10px;font-size:12.5px;font-weight:600;
    background:var(--navy);color:#fff;padding:4px 12px;border-radius:2px;letter-spacing:.05em;
  }
  .tab .idx{
    display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;
    align-items:center;justify-content:center;font-size:13px;font-weight:600;margin-right:9px;flex:none;
  }
  .tab .line{display:flex;align-items:center}

  .empty{background:#fff;border:1px dashed var(--line);padding:26px;color:var(--muted);text-align:center}

  /* ================= LAND DETAIL ================= */
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:#fff;border:1px solid var(--line);margin-bottom:24px}
  .fact{padding:14px 18px;border-right:1px solid var(--line)}
  .fact:last-child{border-right:none}
  .fact .k{font-size:12.5px;color:var(--muted)}
  .fact .v{font-size:16px;font-weight:600;color:var(--navy);margin-top:3px}
  .flagged{color:var(--flag)}
  .remarks{background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold);padding:14px 18px;margin-bottom:24px}
  h3.sec{font-family:'Barlow Condensed',sans-serif;font-size:20px;letter-spacing:.05em;color:var(--navy);margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:28px}
  .card{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .card .thumb{height:150px;background:#DDE3ED;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
  .card .thumb img{width:100%;height:100%;object-fit:cover}
  .card video{width:100%;height:150px;background:#000}
  .card .kind{font-family:'Barlow Condensed',sans-serif;font-size:16px;letter-spacing:.1em;color:var(--flag);font-weight:700}
  .card .cap{padding:11px 13px;font-size:14px;flex:1}
  .card .acts{display:flex;border-top:1px solid var(--line)}
  .card .acts a{flex:1;text-align:center;padding:9px 4px;font-size:13px;text-decoration:none;color:var(--navy);border-right:1px solid var(--line)}
  .card .acts a:last-child{border-right:none}
  .card .acts a:hover{background:#F3F0E2;color:#8A6D1A}

  .lb{position:fixed;inset:0;background:rgba(8,16,38,.94);display:none;align-items:center;justify-content:center;z-index:60;padding:24px}
  .lb.on{display:flex}
  .lb img{max-width:94vw;max-height:82vh;object-fit:contain}
  .lb .close{position:absolute;top:14px;right:20px;background:none;border:none;color:#fff;font-size:34px;cursor:pointer}
  .lb .dl{position:absolute;bottom:22px;color:var(--gold-lt);text-decoration:none;border-bottom:1px solid var(--gold-lt)}

  footer{background:var(--navy-d);color:#AFBDD8;text-align:center;padding:16px;font-size:13px}
  footer b{color:#fff;font-weight:600}

  @media (max-width:700px){
    .mobtab{
      display:block;margin:14px 16px 4px;padding:18px;text-align:center;text-decoration:none;
      background:linear-gradient(135deg,#12285E 0%,#1B7A3E 100%);color:#fff;border:2px solid var(--gold);
      font-family:'Barlow Condensed',sans-serif;font-size:22px;letter-spacing:.08em;font-weight:700;
    }
    .hotspot{display:none}
    .topwrap{grid-template-columns:44px 1fr}
    .topwrap img{width:44px;height:44px}
    .dtab{padding:9px 16px}
    .fact{border-right:none;border-bottom:1px solid var(--line)}
  }
</style>
</head>
<body>

<div id="shell"></div>

<div class="lb" id="lb">
  <button class="close" id="lbClose" aria-label="Close">&times;</button>
  <img id="lbImg" alt="">
  <a class="dl" id="lbDl" download>Download this photo</a>
</div>

<script src="data.js"></script>
<script>
(function(){
  var shell = document.getElementById('shell');

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function findSub(id){ for (var i=0;i<SUBDIVISIONS.length;i++) if (SUBDIVISIONS[i].id===id) return SUBDIVISIONS[i]; return null; }
  function findPs(s,id){ if(!s) return null; for (var i=0;i<s.stations.length;i++) if (s.stations[i].id===id) return s.stations[i]; return null; }
  function findLand(p,id){ if(!p) return null; var L=p.lands||[]; for (var i=0;i<L.length;i++) if (L[i].id===id) return L[i]; return null; }

  function topbar(){
    return '<div class="topbar"><div class="topwrap">' +
      '<a href="#/"><img src="'+esc(SITE.logo)+'" alt="District Police emblem" onerror="this.style.visibility=\'hidden\'"></a>' +
      '<div class="dtab"><div class="en">'+esc(SITE.district)+'</div>' +
      '<div class="te">'+esc(SITE.districtTe)+'</div></div>' +
      '<span></span></div></div>';
  }
  function foot(){
    return '<footer><b>'+esc(SITE.officer.name)+'</b> — '+esc(SITE.officer.designation)+'</footer>';
  }
  function crumbs(parts){
    var h='<div class="crumb">';
    parts.forEach(function(p,i){
      if(i) h+='<span class="sep">/</span>';
      h += p.href ? '<a href="'+p.href+'">'+esc(p.label)+'</a>' : esc(p.label);
    });
    return h+'</div>';
  }
  function page(inner){ return topbar() + '<main>' + inner + '</main>' + foot(); }

  /* ---------- 1. MAIN PAGE ---------- */
  function home(){
    return '<div class="hero">' +
      '<img src="'+esc(SITE.mainImage)+'" alt="Sri Sathya Sai District Police Lands Digitalization">' +
      '<a class="hotspot" href="#/subdivisions" aria-label="Police Lands Information"></a>' +
      '</div>' +
      '<a class="mobtab" href="#/subdivisions">POLICE LANDS INFORMATION</a>' + foot();
  }

  /* ---------- 2. SUB-DIVISIONS ---------- */
  function subdivisions(){
    var h = crumbs([{label:'Main page',href:'#/'},{label:'Sub-divisions'}]);
    h += '<div class="banner"><h2>POLICE SUB-DIVISIONS</h2><p>Select a sub-division to view its police stations</p></div>';
    h += '<div class="tabs five">';
    SUBDIVISIONS.forEach(function(s){
      h += '<a class="tab" href="#/sub/'+s.id+'" style="border-top-color:'+esc(s.color)+'">' +
           '<div class="nm" style="color:'+esc(s.color)+'">'+esc(s.name).toUpperCase() +
           '<span class="te">'+esc(s.nameTe)+'</span></div>' +
           '<span class="cnt" style="background:'+esc(s.color)+'">POLICE STATIONS – '+s.stations.length+'</span></a>';
    });
    return page(h + '</div>');
  }

  /* ---------- 3. POLICE STATIONS ---------- */
  function stations(subId){
    var s = findSub(subId);
    if(!s) return page(notFound());
    var h = crumbs([{label:'Main page',href:'#/'},{label:'Sub-divisions',href:'#/subdivisions'},{label:s.name}]);
    h += '<div class="banner" style="background:'+esc(s.color)+'"><h2>'+esc(s.name).toUpperCase()+' SUB-DIVISION</h2>' +
         '<p>Police stations – '+s.stations.length+'</p></div>';
    if(!s.stations.length) return page(h + '<div class="empty">No police stations added yet.</div>');
    h += '<div class="tabs ps">';
    s.stations.forEach(function(p,i){
      h += '<a class="tab" href="#/ps/'+s.id+'/'+p.id+'" style="border-top-color:'+esc(s.color)+'">' +
           '<div class="line"><span class="idx" style="background:'+esc(s.color)+'">'+(i+1)+'</span>' +
           '<span class="nm" style="color:'+esc(s.color)+'">'+esc(p.name)+'</span></div></a>';
    });
    return page(h + '</div>');
  }

  /* ---------- 4. LANDS ---------- */
  function lands(subId, psId){
    var s = findSub(subId), p = findPs(s, psId);
    if(!p) return page(notFound());
    var h = crumbs([{label:'Main page',href:'#/'},{label:'Sub-divisions',href:'#/subdivisions'},
                    {label:s.name,href:'#/sub/'+s.id},{label:p.name}]);
    h += '<div class="banner" style="background:'+esc(s.color)+'"><h2>'+esc(p.name).toUpperCase()+'</h2>' +
         '<p>'+esc(s.name)+' sub-division</p></div>';
    if(!(p.lands||[]).length) return page(h + '<div class="empty">No lands added yet.</div>');
    h += '<div class="tabs land">';
    p.lands.forEach(function(l){
      var meta = [l.survey,l.extent].filter(Boolean).join('  \u00b7  ');
      h += '<a class="tab" href="#/land/'+s.id+'/'+p.id+'/'+l.id+'" style="border-top-color:'+esc(s.color)+'">' +
           '<div class="nm" style="color:'+esc(s.color)+'">'+esc(l.name).toUpperCase()+'</div>' +
           (meta ? '<div style="font-size:13.5px;color:#5A6579;margin-top:5px">'+esc(meta)+'</div>' : '') +
           '<span class="cnt" style="background:'+esc(s.color)+'">'+((l.files||[]).length)+' FILES</span></a>';
    });
    return page(h + '</div>');
  }

  /* ---------- 5. LAND DETAIL ---------- */
  function land(subId, psId, landId){
    var s = findSub(subId), p = findPs(s, psId), l = findLand(p, landId);
    if(!l) return page(notFound());
    var h = crumbs([{label:'Main page',href:'#/'},{label:'Sub-divisions',href:'#/subdivisions'},
                    {label:s.name,href:'#/sub/'+s.id},{label:p.name,href:'#/ps/'+s.id+'/'+p.id},{label:l.name}]);
    h += '<div class="banner" style="background:'+esc(s.color)+'"><h2>'+esc(l.name).toUpperCase()+'</h2>' +
         '<p>'+esc(p.name)+', '+esc(s.name)+' sub-division</p></div>';

    var facts = [['Survey number',l.survey],['Extent',l.extent],['Village / Mandal',l.village],['Present status',l.status]]
                .filter(function(f){ return f[1]; });
    if (facts.length){
      h += '<div class="facts">';
      facts.forEach(function(f){
        var flag = /dispute|encroach/i.test(f[1]) ? ' flagged' : '';
        h += '<div class="fact"><div class="k">'+esc(f[0])+'</div><div class="v'+flag+'">'+esc(f[1])+'</div></div>';
      });
      h += '</div>';
    }
    if (l.remarks) h += '<div class="remarks">'+esc(l.remarks)+'</div>';

    var files = l.files || [];
    if(!files.length) return page(h + '<div class="empty">Photos, videos and documents for this land have not been uploaded yet.</div>');

    function block(title, list, render){
      if(!list.length) return '';
      var o = '<h3 class="sec">'+title+'</h3><div class="grid">';
      list.forEach(function(f){
        o += '<div class="card">' + render(f) + '<div class="cap">'+esc(f.title)+'</div>' +
             '<div class="acts"><a href="'+esc(f.src)+'" target="_blank" rel="noopener">Open</a>' +
             '<a href="'+esc(f.src)+'" download>Download</a></div></div>';
      });
      return o + '</div>';
    }
    var by = function(t){ return files.filter(function(f){ return f.type===t; }); };

    h += block('PHOTOGRAPHS', by('photo'), function(f){
      return '<div class="thumb" data-full="'+esc(f.src)+'"><img src="'+esc(f.src)+'" alt="'+esc(f.title)+'" ' +
             'onerror="this.parentNode.innerHTML=\'<span class=&quot;kind&quot;>FILE MISSING</span>\'"></div>';
    });
    h += block('VIDEOS', by('video'), function(f){
      return /^https?:/i.test(f.src)
        ? '<div class="thumb"><span class="kind">VIDEO LINK</span></div>'
        : '<video controls preload="metadata" src="'+esc(f.src)+'"></video>';
    });
    h += block('DOCUMENTS', by('pdf'), function(){
      return '<div class="thumb"><span class="kind">PDF</span></div>';
    });
    return page(h);
  }

  function notFound(){
    return '<div class="empty">This page was not found. <a href="#/">Go to the main page</a>.</div>';
  }

  /* ---------- lightbox ---------- */
  var lbEl=document.getElementById('lb'), lbImg=document.getElementById('lbImg'), lbDl=document.getElementById('lbDl');
  function shut(){ lbEl.classList.remove('on'); lbImg.src=''; }
  document.getElementById('lbClose').onclick = shut;
  lbEl.addEventListener('click', function(e){ if(e.target===lbEl) shut(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') shut(); });
  shell.addEventListener('click', function(e){
    var t = e.target.closest ? e.target.closest('.thumb[data-full]') : null;
    if(t){ lbImg.src = t.getAttribute('data-full'); lbDl.href = t.getAttribute('data-full'); lbEl.classList.add('on'); }
  });

  /* ---------- router ---------- */
  function render(){
    var parts = location.hash.replace(/^#\/?/,'').split('/').filter(Boolean), html;
    if(!parts.length) html = home();
    else if(parts[0]==='subdivisions') html = subdivisions();
    else if(parts[0]==='sub') html = stations(parts[1]);
    else if(parts[0]==='ps') html = lands(parts[1], parts[2]);
    else if(parts[0]==='land') html = land(parts[1], parts[2], parts[3]);
    else html = page(notFound());
    shell.innerHTML = html;
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
